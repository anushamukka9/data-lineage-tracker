[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-lineage-tracker"
version = "0.1.0"
description = "Lightweight dataset provenance tracking: content-hashed dataset versions, a transform lineage graph, and a SQLite-backed CLI for answering 'what produced this dataset?'"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Anusha Mukka", email = "hello@anushamukka.com" },
]
urls = { Homepage = "https://anushamukka.com" }
keywords = ["data-lineage", "provenance", "mlops", "data-engineering", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
dlt = "data_lineage_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["data_lineage_tracker"]
